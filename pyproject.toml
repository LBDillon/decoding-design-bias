[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "decoding-design-bias"
version = "0.2.0"
description = "Analysis code for the decoding design bias paper (Dillon, Maiwald & Crook)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "statsmodels>=0.13",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    "plotly>=5.0",
    "biopython>=1.80",
    "pyyaml",
    "tqdm",
    "requests",
]

[project.scripts]
decoding-bias = "decoding_bias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decoding_bias*"]

[tool.setuptools.package-data]
decoding_bias = ["config_default.yaml", "scoring/*.yaml"]
