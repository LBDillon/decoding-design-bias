[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "decoding-design-bias"
version = "0.2.0"
description = "Reviewer reproduction for the decoding design bias paper"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "statsmodels>=0.13",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
decoding-bias = "decoding_bias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decoding_bias*"]

[tool.setuptools.package-data]
decoding_bias = ["analysis/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
