      score = -global_score (global_score is avg negative log prob over all
      residues; sign-flipped to higher=better). The CLI score_only path is an
      autoregressive inverse-folding score under a sampled/fixed decoding order:
      the scored residue is hidden, while earlier native residues in the order
      are visible.
    model_capability_notes: ProteinMPNN trained on soluble proteins only.
    implementation_notes: Official CLI score_only; entropy/mean_confidence are NA (logits not exported).
    caveats: >
      Wrapper and score object differ from vanilla ProteinMPNN as currently
