# Model score registry - single source of truth for the score object each model
# produces. The post-processor (combine_and_audit_scores.py) joins these static
# fields onto every protein so the combined table carries the full audit schema.
#
# Fields:
#   model_name / paper_label / model_version_or_checkpoint
#   primary_cluster                  coarse grouping for figures
#   conditioning_regime              controlled vocabulary
#   score_type                       controlled vocabulary
#   score_column_used                column in the analysis CSV holding the canonical score
#   score_sign_convention            controlled vocabulary
#   higher_is_better                 bool
#   native_residue_visible_at_scored_position  bool
#   teacher_forced / masked_marginal / autoregressive / structure_conditioned /
#   sequence_conditioned / multimodal_conditioned / energy_based   bools
#   exact_sequence_match_required    bool (structure-conditioned models)
#   stochastic                       bool
#   scoring_temperature              float or NA
#   model_wrapper                    how the score was produced
#   main_methods_description / caveats / model_capability_notes / implementation_notes
#
# Verdicts here reflect notebooks/Scoring_Py/AUDIT_REPORT.md and the TriFlow
# source audit (2026-05-28).

models:

  proteinmpnn:
    model_name: ProteinMPNN
    paper_label: ProteinMPNN
    model_version_or_checkpoint: v_48_020 (dauparas CLI)
    primary_cluster: backbone_only_inverse_folding
    conditioning_regime: backbone_only
    score_type: inverse_folding_conditional_log_likelihood
    score_column_used: proteinmpnn_score
    score_sign_convention: log_probability_higher_better
    higher_is_better: true
    native_residue_visible_at_scored_position: false
    teacher_forced: true
    masked_marginal: false
    autoregressive: true
    structure_conditioned: true
    sequence_conditioned: false
    multimodal_conditioned: false
    energy_based: false
    exact_sequence_match_required: true
    stochastic: false
    scoring_temperature: NA
    model_wrapper: official_proteinmpnn_cli
    main_methods_description: >
      dauparas protein_mpnn_run.py --score_only 1 on vanilla v_48_020 weights (no
      --use_soluble_model). Stored score = -global_score (global_score is the avg
      negative log prob over all residues; sign-flipped to higher=better). Same
      score object as SolubleMPNN: an autoregressive inverse-folding score under a
      sampled/fixed decoding order, the scored residue hidden while earlier native
      residues in the order are visible. NOT the ColabDesign backbone-only marginal.
    model_capability_notes: Backbone-conditioned sequence design (PDB-trained).
    implementation_notes: >
      Official CLI score_only (MPNN_scores.ipynb cell 12, "cohort bridge, AR/CLI").
      The deposited proteinmpnn_score is byte-identical to ProteinMPNN_v020_score
      (max |diff| = 0 over n=10148). The ColabDesign ar_mask=0 marginal (cell 4)
      was computed but did not go into the analysis table.
    caveats: >
      Same score object as SolubleMPNN (official CLI). The earlier ColabDesign
      backbone-only marginal is a DIFFERENT object and is NOT the shipped column;
      verified 2026-07 by row-for-row identity with the CLI cohort-bridge column.

