    sequence_conditioned: false
    multimodal_conditioned: false
    energy_based: false
    exact_sequence_match_required: true
    stochastic: false
    scoring_temperature: NA
    model_wrapper: fair_esm
    main_methods_description: >
      Structure-conditioned sequence log-likelihood from ESM-IF's autoregressive
      decoder (esm.inverse_folding.util.score_sequence, ll_fullseq = mean over all
