    model_capability_notes: Inverse folding from backbone atom coordinates.
    implementation_notes: >
      Stored column is the ll_fullseq mean (named total_score in raw output, but
      it is a per-residue mean). Chain A only. Prefer coordinate-valid mean
      (ll_withcoord) when missing coordinates exist.
    caveats: Raw column name 'total_score' is a mean, not a sum (naming only).

  triflow:
    model_name: TriFlow
    paper_label: TriFlow
    model_version_or_checkpoint: afdb_weights
    primary_cluster: backbone_only_inverse_folding
    conditioning_regime: backbone_only
    score_type: structure_conditioned_flow_predictive_marginal
    score_column_used: triflow_score
    score_sign_convention: log_probability_higher_better
    higher_is_better: true
    native_residue_visible_at_scored_position: false
    teacher_forced: false
    masked_marginal: false
    autoregressive: false
    structure_conditioned: true
    sequence_conditioned: false
    multimodal_conditioned: false
    energy_based: false
    exact_sequence_match_required: true
    stochastic: true
    scoring_temperature: 1.0
    model_wrapper: triflow_repo
    main_methods_description: >
      Flow-matching structure-conditioned predictive marginal: per-position
      log p(WT residue | backbone) accumulated over one Euler denoising trajectory
      from an all-mask initial sequence. temp=1.0 (neutral), run_cfg=False (no CFG
      amplification), noise_label=0 (clean structure).
    model_capability_notes: Flow-matching structure-conditioned sequence design model.
    implementation_notes: >
      Source-audited 2026-05-28: seq_prior is all-mask in the scoring call (mask
      all-False with no conditioning args); native residues never fed to the model
      (model sees noised seq state via seq=, not data['target_feat']); aa_init is
      initial state only. Native used only as the scoring target.
    caveats: >
      STOCHASTIC: probabilities come from one sampled trajectory. Fix the seed or
      average N replicates for reproducibility (record num_stochastic_replicates).

