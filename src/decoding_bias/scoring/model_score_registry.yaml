    model_version_or_checkpoint: hugohrban/progen2-base
    primary_cluster: sequence_only
    conditioning_regime: sequence_only
    score_type: autoregressive_log_likelihood
    score_column_used: progen2_score
    score_sign_convention: log_probability_higher_better
    higher_is_better: true
    native_residue_visible_at_scored_position: true   # AR: position i conditions on the true tokens < i
    teacher_forced: true   # AR exact-likelihood uses teacher forcing by definition; this is correct, not a bug
    masked_marginal: false
    autoregressive: true
    structure_conditioned: false
    sequence_conditioned: true
    multimodal_conditioned: false
    energy_based: false
    exact_sequence_match_required: false
    stochastic: false
    scoring_temperature: NA
    model_wrapper: huggingface
    main_methods_description: >
      Exact autoregressive chain-rule log-likelihood: sum_i log p(s_i | s_<i) via
      shifted logits in one forward pass. score_mean_per_residue = total / length.
    model_capability_notes: Autoregressive protein language model (UniRef90).
    implementation_notes: One token per residue; BOS prepended; 2048-token context (4 long proteins dropped).
    caveats: >
      'teacher_forced=true' here is the CORRECT definition of an exact AR
      likelihood (each position conditions on the true prefix) - NOT the
      teacher-forcing bug that affected the masked models. Do not 'fix' it.

