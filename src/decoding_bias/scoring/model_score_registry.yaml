    paper_label: Caliby
    model_version_or_checkpoint: caliby
    primary_cluster: single_structure_potts_energy
    conditioning_regime: single_structure_potts
    score_type: potts_energy_negative_per_residue
    score_column_used: caliby_score
    score_sign_convention: negative_energy_higher_better
    higher_is_better: true
    native_residue_visible_at_scored_position: false
    teacher_forced: false
    masked_marginal: false
    autoregressive: false
    structure_conditioned: true
    sequence_conditioned: false
    multimodal_conditioned: false
    energy_based: true
    exact_sequence_match_required: true
    stochastic: false
    scoring_temperature: NA
    model_wrapper: caliby_repo
    main_methods_description: >
      Potts pseudo-energy U evaluated on the WT sequence given a SINGLE structure.
      Stored caliby_score = -U/L (per-residue negative energy, higher=better).
      Raw U and U/L also recorded in metadata. This is an ENERGY, not a log-likelihood.
    model_capability_notes: Can support ensemble-conditioned design/scoring.
    implementation_notes: >
      This run used single-structure scoring via model.score(cleaned); no
      structural ensemble supplied. Hence single_structure_potts, not ensemble.
    caveats: Do NOT describe -U/L as a log-likelihood. Energy-based; single structure only.

  soluble_caliby:
