      is negative; higher = better). Raw soluble_caliby_U and
      soluble_caliby_U_per_res live in metadata.
    model_capability_notes: Soluble-specialised Caliby (analogue of SolubleMPNN for the Potts family).
    implementation_notes: >
      Spearman vs vanilla Caliby = 0.99 on v12. Membrane-protein categories
      (translocase, electron_carrier, membrane) downranked relative to vanilla
      Caliby - same pattern as SolubleMPNN vs ProteinMPNN.
    caveats: Energy-based; single-structure only; same sign / energy caveats as vanilla Caliby.
