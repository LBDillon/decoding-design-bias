    model_capability_notes: Larger autoregressive protein LM.
    implementation_notes: 1024-token context (107 long proteins dropped). Anomalously high species partial R2 - verify.
    caveats: Low family R2 / high species partial R2 needs scrutiny (context truncation?).

  protgpt2:
