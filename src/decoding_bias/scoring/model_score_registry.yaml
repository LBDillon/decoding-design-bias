    model_capability_notes: GPT-2-style autoregressive protein LM.
    implementation_notes: >
      BPE tokenisation (~3 residues/token); token_count_per_residue stored as a
      potential covariate. Per-residue used for cross-model analysis.
    caveats: BPE means token counts differ from all per-residue-tokenised models.

  caliby:
